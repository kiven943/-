<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أسعار">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>أسعار مباشرة</title>
<style>
:root{
  --bg:#0b0f17; --surface:#131a26; --surface2:#1a2333; --border:#222d41;
  --text:#eaf0fa; --muted:#8a97ad; --up:#16c784; --down:#ea3943;
  --up-bg:rgba(22,199,132,.14); --down-bg:rgba(234,57,67,.14); --accent:#4c8dff;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f3f6fb; --surface:#ffffff; --surface2:#eef2f9; --border:#dfe6f1;
    --text:#111a2b; --muted:#6a778d; --shadow:0 6px 24px rgba(20,40,80,.08);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  min-height:100vh;
}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 18px}
h1{font-size:24px;font-weight:800;letter-spacing:.2px}
.sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.status{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  padding:8px 12px;border-radius:999px;font-size:12.5px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.status.live .dot{background:var(--up);box-shadow:0 0 0 0 rgba(22,199,132,.6);animation:pulse 1.8s infinite}
.status.live{color:var(--text)}
.status.poll .dot{background:#f5a623}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(22,199,132,0)}100%{box-shadow:0 0 0 0 rgba(22,199,132,0)}}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 16px;
  box-shadow:var(--shadow);transition:transform .15s ease,background .4s ease}
.card:active{transform:scale(.985)}
.top{display:flex;align-items:center;gap:12px}
.ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;
  color:#fff;flex:none}
.name{flex:1;min-width:0}
.name b{display:block;font-size:16px}
.name span{font-size:12px;color:var(--muted)}
.right{text-align:left;direction:ltr}
.price{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;transition:color .3s}
.card.up .price.flash{color:var(--up)} .card.down .price.flash{color:var(--down)}
.pill{display:inline-block;margin-top:5px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:700;
  font-variant-numeric:tabular-nums;direction:ltr}
.pill.pos{background:var(--up-bg);color:var(--up)} .pill.neg{background:var(--down-bg);color:var(--down)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface2);border-radius:12px;padding:8px 10px}
.stat small{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.stat b{font-size:12.5px;font-variant-numeric:tabular-nums;direction:ltr;display:block;text-align:right}
.range{height:5px;border-radius:99px;background:var(--surface2);margin-top:12px;position:relative;overflow:hidden}
.range i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--down),var(--up));opacity:.85;
  border-radius:99px;transition:width .5s ease}
.skeleton{color:transparent !important;background:var(--surface2);border-radius:8px}
footer{margin-top:20px;text-align:center;font-size:12px;color:var(--muted);line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>أسعار السوق</h1>
      <div class="sub" id="upd">جارٍ الاتصال…</div>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="stxt">اتصال</span></div>
  </header>
  <div class="list" id="list"></div>
  <footer>البيانات من Binance مقابل USDT · التغيّر خلال آخر 24 ساعة</footer>
</div>

<script>
const COINS = [
  ["BTC","Bitcoin","#f7931a"],["ETH","Ethereum","#627eea"],["BNB","BNB","#f0b90b"],
  ["SOL","Solana","#9945ff"],["XRP","XRP","#2f7cc0"],["ADA","Cardano","#2a71d0"],
  ["DOGE","Dogecoin","#c2a633"],["AVAX","Avalanche","#e84142"],["LINK","Chainlink","#2a5ada"],
  ["AAVE","Aave","#b6509e"]
];
const last = {};
const list = document.getElementById("list");

list.innerHTML = COINS.map(([s,n,c]) => `
  <div class="card" id="c-${s}">
    <div class="top">
      <div class="ico" style="background:${c}">${s[0]}</div>
      <div class="name"><b>${s}</b><span>${n} / USDT</span></div>
      <div class="right">
        <div class="price skeleton" id="p-${s}">00,000.00</div>
        <span class="pill pos skeleton" id="ch-${s}">+0.00%</span>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><small>الأعلى 24س</small><b id="h-${s}">—</b></div>
      <div class="stat"><small>الأدنى 24س</small><b id="l-${s}">—</b></div>
      <div class="stat"><small>الحجم (USDT)</small><b id="v-${s}">—</b></div>
    </div>
    <div class="range"><i id="r-${s}" style="width:50%"></i></div>
  </div>`).join("");

function fmtPrice(p){
  const d = p >= 1000 ? 2 : p >= 1 ? 3 : p >= 0.1 ? 4 : 6;
  return p.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtVol(v){
  if (v >= 1e9) return (v/1e9).toFixed(2)+"B";
  if (v >= 1e6) return (v/1e6).toFixed(2)+"M";
  if (v >= 1e3) return (v/1e3).toFixed(1)+"K";
  return v.toFixed(0);
}

function update(sym, d){
  const el = document.getElementById("p-"+sym);
  if (!el) return;
  const card = document.getElementById("c-"+sym);
  const prev = last[sym];
  const pct = d.o ? (d.c - d.o) / d.o * 100 : 0;

  el.classList.remove("skeleton");
  el.textContent = fmtPrice(d.c);
  const ch = document.getElementById("ch-"+sym);
  ch.classList.remove("skeleton");
  ch.textContent = (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%";
  ch.className = "pill " + (pct >= 0 ? "pos" : "neg");

  document.getElementById("h-"+sym).textContent = fmtPrice(d.h);
  document.getElementById("l-"+sym).textContent = fmtPrice(d.l);
  document.getElementById("v-"+sym).textContent = fmtVol(d.q);
  const span = d.h - d.l;
  document.getElementById("r-"+sym).style.width = (span > 0 ? Math.min(100, Math.max(2, (d.c - d.l) / span * 100)) : 50) + "%";

  if (prev !== undefined && d.c !== prev){
    card.classList.remove("up","down");
    card.classList.add(d.c > prev ? "up" : "down");
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 450);
  }
  last[sym] = d.c;
  document.getElementById("upd").textContent = "آخر تحديث: " + new Date().toLocaleTimeString("ar-DZ",{hour12:false});
}

const statusEl = document.getElementById("status"), stxt = document.getElementById("stxt");
function setStatus(mode){
  statusEl.className = "status " + mode;
  stxt.textContent = mode === "live" ? "مباشر" : mode === "poll" ? "تحديث دوري" : "غير متصل";
}

async function fetchOnce(){
  try{
    const url = "https://api.binance.com/api/v3/ticker/24hr?symbols=" +
      encodeURIComponent(JSON.stringify(COINS.map(c => c[0]+"USDT")));
    const arr = await (await fetch(url)).json();
    arr.forEach(t => update(t.symbol.replace("USDT",""), {
      c:+t.lastPrice, o:+t.openPrice, h:+t.highPrice, l:+t.lowPrice, q:+t.quoteVolume }));
    if (!wsOpen) setStatus("poll");
  }catch(e){ if (!wsOpen) setStatus("off"); }
}

let ws, wsOpen = false;
function connect(){
  try{
    const streams = COINS.map(c => c[0].toLowerCase()+"usdt@miniTicker").join("/");
    ws = new WebSocket("wss://stream.binance.com:9443/stream?streams=" + streams);
    ws.onopen = () => { wsOpen = true; setStatus("live"); };
    ws.onmessage = e => {
      const m = JSON.parse(e.data).data;
      update(m.s.replace("USDT",""), { c:+m.c, o:+m.o, h:+m.h, l:+m.l, q:+m.q });
    };
    ws.onclose = ws.onerror = () => {
      if (!wsOpen && ws.__retry) return;
      wsOpen = false; setStatus("poll"); ws.__retry = true;
      setTimeout(connect, 4000);
    };
  }catch(e){ setTimeout(connect, 5000); }
}

fetchOnce();
connect();
setInterval(() => { if (!wsOpen) fetchOnce(); }, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !wsOpen) fetchOnce(); });
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
</script>
</body>
</html>
